<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>Brainfuck Playground</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                sans-serif;
            background: #111827;
            color: #f3f4f6;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
        }

        .container {
            width: min(760px, 92%);
            margin: 0 auto;
            padding: 56px 0 32px;
        }

        header {
            margin-bottom: 32px;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.5rem, 7vw, 4rem);
            letter-spacing: -0.06em;
        }

        h1 span {
            color: #f7a41d;
        }

        header p {
            margin-top: 8px;
            color: #9ca3af;
            line-height: 1.6;
        }

        .panel {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 24px;
            border: 1px solid #374151;
            border-radius: 14px;
            background: #182131;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .section-heading,
        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        textarea,
        select,
        button,
        pre {
            font: inherit;
            border-radius: 8px;
        }

        textarea,
        select,
        pre {
            color: #e5e7eb;
            background: #111827;
            border: 1px solid #374151;
        }

        textarea {
            width: 100%;
            padding: 14px;
            resize: vertical;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        textarea:focus,
        select:focus {
            outline: 2px solid #f7a41d;
            outline-offset: 2px;
        }

        #source {
            min-height: 220px;
            tab-size: 4;
        }

        .input {
            min-height: 68px;
        }

        .controls {
            justify-content: space-between;
            flex-wrap: wrap;
            margin: 2px 0;
        }

        .engine {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select {
            max-width: 100%;
            padding: 10px;
        }

        button {
            padding: 10px 18px;
            border: none;
            background: #f7a41d;
            color: #111827;
            font-weight: 700;
            cursor: pointer;
            transition: background 120ms ease;
        }

        button:hover:not(:disabled) {
            background: #ffc15c;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .secondary {
            padding: 7px 11px;
            background: #273449;
            color: #e5e7eb;
            font-size: 0.85rem;
        }

        .secondary:hover:not(:disabled) {
            background: #374151;
        }

        .output-heading {
            margin-top: 4px;
        }

        pre {
            min-height: 100px;
            margin: 0;
            padding: 14px;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
            font-family: "SFMono-Regular", Consolas, monospace;
            line-height: 1.7;
        }

        #status {
            margin: -4px 0 0;
            color: #9ca3af;
            font-size: 0.8rem;
        }

        footer {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 24px;
            color: #9ca3af;
            font-size: 0.8rem;
        }

        footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 24px;
        }

        footer span {
            display: inline-flex;
            align-items: center;
            padding: 7px 12px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 999px;
            background: rgba(31, 41, 55, 0.45);
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.3px;
            line-height: 1.4;
            transition: border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease;
        }

        footer span:hover {
            border-color: rgba(96, 165, 250, 0.55);
            background: rgba(59, 130, 246, 0.1);
            color: #e2e8f0;
        }

        @media (max-width: 520px) {
            .container {
                padding-top: 32px;
            }

            .panel {
                padding: 16px;
            }

            .controls,
            .engine {
                align-items: stretch;
            }

            .controls {
                flex-direction: column;
            }

            .engine {
                justify-content: space-between;
            }

            .controls>button {
                width: 100%;
            }
        }


        /* Consistent sizing prevents padded elements from overflowing */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            min-width: 320px;
        }

        body {
            margin: 0;
            min-height: 100vh;
        }

        /* Slim GitHub strip */
        .github-strip {
            min-height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            background: #0d1420;
            border-bottom: 1px solid #273449;
        }

        .github-strip a {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: color 150ms ease;
        }

        .github-strip a:hover {
            color: #f7a41d;
        }

        .github-strip svg {
            flex-shrink: 0;
        }

        .github-arrow {
            font-size: 0.9rem;
            color: #6b7280;
        }

        /* Keep the main content centered */
        .container {
            width: min(760px, calc(100% - 32px));
            margin-inline: auto;
            padding: 48px 0 32px;
        }

        /* Make all form elements respect their parent's width */
        .panel {
            width: 100%;
            min-width: 0;
        }

        textarea,
        select,
        pre {
            min-width: 0;
            max-width: 100%;
        }

        textarea {
            display: block;
            width: 100%;
        }

        /* Keep the editor and output visually consistent */
        #source,
        #stdin,
        #output {
            width: 100%;
            border-radius: 8px;
        }

        /* Mobile spacing */
        @media (max-width: 520px) {
            .container {
                padding-top: 30px;
            }

            .panel {
                padding: 16px;
            }
        }
    </style>

    <script type="module" src="./app.js"></script>
</head>

<body>

    <nav class="github-strip" aria-label="Project links">
        <a href="https://github.com/JourneyCodesAyush/BrainFuck" target="_blank" rel="noopener noreferrer"
            aria-label="View source code on GitHub">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                <path
                    d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.54v-2.1c-3.1.67-3.76-1.32-3.76-1.32-.5-1.28-1.23-1.62-1.23-1.62-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15.99 1.7 2.59 1.21 3.22.92.1-.72.39-1.21.7-1.49-2.48-.28-5.09-1.24-5.09-5.51 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.15a10.6 10.6 0 0 1 5.55 0c2.11-1.45 3.05-1.15 3.05-1.15.61 1.54.23 2.68.11 2.96.72.78 1.15 1.78 1.15 3 0 4.28-2.61 5.23-5.1 5.5.4.35.75 1.03.75 2.08v3.07c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z" />
            </svg>
            <span>View on GitHub</span>
            <span class="github-arrow" aria-hidden="true">↗</span>
        </a>
    </nav>

    <main class="container">
        <header>
            <h1>Brainfuck<span>.</span></h1>
            <p>A Brainfuck interpreter powered by C++ and WebAssembly.</p>
        </header>

        <section class="panel">
            <div class="section-heading">
                <label for="source">Source code</label>
                <button id="example" class="secondary">Hello World</button>
            </div>

            <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off"
                placeholder="Write your Brainfuck program here...">
++++++++[>++++++++<-]>+.+.+.</textarea>

            <div class="controls">
                <div class="engine">
                    <label for="mode">Engine</label>
                    <select id="mode">
                        <option value="char">CHAR interpreter</option>
                        <option value="ir">IR virtual machine</option>
                    </select>
                </div>

                <button id="run" disabled>Loading...</button>
            </div>

            <label for="stdin">Standard input</label>
            <textarea id="stdin" class="input" rows="2" placeholder="Input for the , instruction"></textarea>

            <div class="section-heading output-heading">
                <label for="output">Output</label>
                <button id="clear" class="secondary">Clear output</button>
            </div>

            <pre id="output" aria-live="polite">
Initializing WebAssembly...</pre>
            <p id="status" role="status">Loading interpreter...</p>
        </section>

        <footer>
            <span>C++17</span> <span>WebAssembly</span>
            <span>Vanilla JavaScript</span>
        </footer>
    </main>
</body>

</html>
