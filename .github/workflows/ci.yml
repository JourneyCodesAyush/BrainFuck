name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pre-commit:
    name: Formatting and hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Run checks
        run: pre-commit run --all-files

  build:
    name: Build interpreters
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install C++ build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build C++
        working-directory: engines/cpp
        run: make

      - name: Build Zig
        working-directory: engines/zig
        run: zig build
